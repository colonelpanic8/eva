name: Publish F-Droid Repository

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_count:
        description: Number of recent production releases to inspect
        required: false
        default: "4"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Build and deploy self-hosted repository
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install fdroidserver
        run: pip install --disable-pip-version-check fdroidserver
      - name: Build signed repository index
        env:
          GH_TOKEN: ${{ github.token }}
          FDROID_OUT_DIR: ${{ github.workspace }}/target/fdroid
          FDROID_RELEASE_COUNT: ${{ inputs.release_count || '4' }}
          FDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./scripts/fdroid/build-repo.sh
      - name: Assemble Pages site
        run: |
          set -euo pipefail
          mkdir -p site/fdroid
          cp -r target/fdroid/repo site/fdroid/repo
          ./scripts/fdroid/landing-page.py target/fdroid site/index.html
      - name: Summarize repository
        run: |
          {
            echo "### EVA self-hosted F-Droid repository"
            echo
            echo "Repository: \`https://colonelpanic8.github.io/eva/fdroid/repo\`"
            echo "Fingerprint: \`$(cat target/fdroid/fingerprint.txt)\`"
            echo
            find site/fdroid/repo -maxdepth 1 -name '*.apk' -printf -- "- \`%f\`\n"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
      - uses: actions/deploy-pages@v5.0.1
        id: deploy
