name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing vMAJOR.MINOR.PATCH tag to build and release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}
      - uses: gradle/actions/wrapper-validation@v6.3.0
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4.0.1
      - name: Configure version and signing
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "Release signing requires the $variable secret." >&2
              exit 1
            fi
          done
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be vMAJOR.MINOR.PATCH: $RELEASE_TAG" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/eva-release.jks"
          chmod 600 "$RUNNER_TEMP/eva-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/eva-release.jks" \
            -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/eva-release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            echo "RELEASE_VERSION=${RELEASE_TAG#v}"
          } >> "$GITHUB_ENV"
      - name: Build and verify signed release
        run: ./scripts/build-release.sh "$RELEASE_VERSION"
      - name: Report artifact
        run: |
          ls -lh dist/eva.apk
          echo "APK SHA-256: $(sha256sum dist/eva.apk | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: eva-${{ env.RELEASE_VERSION }}
          path: dist/eva.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release asset
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: EVA v${{ env.RELEASE_VERSION }}
          files: dist/eva.apk
          generate_release_notes: true
