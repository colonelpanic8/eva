androidAppfunctionsReturnValue:
  perScreenDeviceStates:
    - description: "Battery Saver. Provides options to save power and extend battery life, including a manual toggle, mode selection between Standard and Extreme, scheduling, and adaptive battery management. Note that either Extreme or Standard mode can be selected, not both. This screen is identical on device with: api_battery_saver_screen"
      deviceStateItems:
        - hintText: "Failing set preconditions: This device must not be plugged in."
          jsonValue: "false"
          purpose: Whether or not Battery Saver is enabled
          key: battery_saver_screen/battery_saver
          name:
            english: Use Battery Saver
            localized: Use Battery Saver
        - jsonValue: "true"
          purpose: Enables Standard Battery Saver mode which limits visual effects and background activity
          key: battery_saver_screen/basic_battery_saver
          name:
            english: Standard Battery Saver
            localized: Standard Battery Saver
        - jsonValue: "false"
          purpose: Enables Extreme Battery Saver mode which pauses non-essential apps and notifications
          key: battery_saver_screen/extreme_battery_saver
          name:
            english: Extreme Battery Saver
            localized: Extreme Battery Saver
      intentUri: "intent:#Intent;action=com.android.settings.action.LAUNCH_SETTINGS_PAGES;package=com.android.settings;S.screen_key=battery_saver_screen;end"
    - description: "Displays information about the battery, including the date the battery was manufactured, the date the battery was first used, and the battery charge cycle count. Passing screen access preconditions: The battery settings provider must provide the battery information feature."
      deviceStateItems:
        - hintText: "Passing get preconditions: The battery settings provider must provide the battery information feature."
          jsonValue: "<external_data>2026-05-21</external_data>"
          purpose: Displays the date the battery was manufactured.
          key: battery_info_screen/battery_info_manufacture_date
        - hintText: "Passing get preconditions: The battery settings provider must provide the battery information feature."
          jsonValue: "<external_data>2026-09-04</external_data>"
          purpose: Displays the date the battery was first used.
          key: battery_info_screen/battery_info_first_use_date
        - hintText: "Passing get preconditions: The battery settings provider must provide the battery information feature."
          jsonValue: 9
          purpose: Displays the battery charge cycle count.
          key: battery_info_screen/battery_info_cycle_count
      intentUri: "intent:#Intent;action=com.android.settings.action.LAUNCH_SETTINGS_PAGES;package=com.android.settings;S.screen_key=battery_info_screen;end"
    - description: "Battery & charging. Allows users to monitor current battery level and status, view detailed usage statistics, and manage power-saving and battery health features such as Battery Saver and Adaptive Charging. Passing get preconditions: The device must support showing the top level battery category in settings."
      deviceStateItems:
        - hintText: "Passing get preconditions: The device must have a battery"
          jsonValue: 100
          purpose: Displays the current battery level as a percentage
          key: power_usage_summary_screen/battery_header
          name:
            english:  
            localized:  
        - hintText: "Passing get preconditions: The device must have a battery present and the device must support making the battery percentage setting available."
          jsonValue: "true"
          purpose: Whether to display the battery percentage next to the icon in the status bar
          key: power_usage_summary_screen/status_bar_show_battery_percent
          name:
            english: Battery percentage
            localized: Battery percentage
      intentUri: "intent:#Intent;action=com.android.settings.action.LAUNCH_SETTINGS_PAGES;package=com.android.settings;S.screen_key=power_usage_summary_screen;end"
    - description: "Allows users to manage background power consumption modes for the selected app. This can be optimized based on usage, unrestricted which will use more battery, or disabled entirely which may cause apps to not work as expected. For example, notifications may be delayed. Passing screen access preconditions: The device must be configured to allow the specific app to change background power consumption mode.[extra_package_name=com.amazon.mShop.android.shopping]"
      deviceStateItems:
        hintText: "Passing get preconditions: The device must be configured to allow the specific app to change background power consumption mode."
        jsonValue: "true"
        purpose: Controls whether the app is allowed to perform background work. Apps with this toggle disabled may not work as expected. Notifications may be delayed.
        key: power_background_usage_detail/background_usage_allowability_switch
      intentUri: "intent:#Intent;action=com.android.settings.action.LAUNCH_SETTINGS_PAGES;package=com.android.settings;S.screen_key=power_background_usage_detail;S.itemization=com.amazon.mShop.android.shopping;end"
